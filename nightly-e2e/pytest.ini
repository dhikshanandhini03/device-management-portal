[pytest]
testpaths = tests
pythonpath = .
addopts =
    -v
    -ra
    --strict-markers
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=reports/test-results
    --reruns=1
    --reruns-delay=2
markers =
    smoke: availability checks; the pipeline stops if these fail
    end_to_end: multi-module business workflows
    devices: device monitoring and inventory
    remote_operations: remote command execution
    firmware: firmware deployments and rollback
    alerts: alert lifecycle
    users: user management and RBAC
    reports: exports, analytics and diagnostics
    settings: system configuration
filterwarnings =
    ignore::DeprecationWarning
