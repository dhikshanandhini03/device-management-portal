[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
    --output=reports/test-results
    --screenshot=only-on-failure
    --tracing=retain-on-failure
markers =
    smoke: critical-path checks run on every change
    regression: full regression suite
    sanity: quick sanity checks after deployment
    login: authentication and session tests
    dashboard: fleet dashboard tests
    device_management: device inventory and device details
    remote_operations: remote command execution
    firmware: firmware inventory and deployments
    applications: application management
    monitoring: monitoring and diagnostics
    alerts: alerts and notifications
    analytics: analytics and reports
    users: user management and RBAC
    audit: audit log tests
    api: REST API tests (no browser)
    end_to_end: multi-module business workflows
log_file = logs/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)-7s [%(name)s] %(message)s
log_cli = false
filterwarnings =
    ignore::DeprecationWarning
