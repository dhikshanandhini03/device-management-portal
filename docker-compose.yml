name: bell-stb

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bellstb}
      POSTGRES_USER: ${POSTGRES_USER:-bellstb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bellstb_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bellstb}:${POSTGRES_PASSWORD:-bellstb_dev_password}@db:5432/${POSTGRES_DB:-bellstb}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-dev-gateway-key-change-me}
      SIMULATOR_URL: http://simulator:8100
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SEED_DEVICE_COUNT: ${SEED_DEVICE_COUNT:-500}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      SEED_SUPPORT_PASSWORD: ${SEED_SUPPORT_PASSWORD:-Support@12345}
      SEED_READONLY_PASSWORD: ${SEED_READONLY_PASSWORD:-Readonly@12345}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-8010}:8000"
    restart: unless-stopped

  simulator:
    build: ./simulator
    environment:
      BACKEND_URL: http://backend:8000
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-dev-gateway-key-change-me}
      SIM_AUTOSTART: ${SIM_AUTOSTART:-true}
      SIM_TICK_SECONDS: ${SIM_TICK_SECONDS:-5}
      SIM_COMMAND_STAGE_SECONDS: ${SIM_COMMAND_STAGE_SECONDS:-1.5}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/status', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
