name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser for the UI suite"
        type: choice
        options: [chromium, firefox, webkit]
        default: chromium
      markers:
        description: "pytest -m expression (empty = full suite)"
        type: string
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt -r simulator/requirements.txt
      - name: Import check
        working-directory: backend
        run: python -c "import app.main, app.seed; print('backend imports OK')"
      - name: Simulator import check
        working-directory: simulator
        run: python -c "import stb_simulator.engine; print('simulator imports OK')"

  automation:
    needs: [frontend-build, backend-check]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BROWSER: ${{ inputs.browser || 'chromium' }}
    steps:
      - uses: actions/checkout@v4

      - name: Start portal stack (PostgreSQL, backend, simulator, frontend)
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Stack status
        if: always()
        run: docker compose ps

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Install automation dependencies
        working-directory: automation
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps ${{ env.BROWSER }}

      - name: Run Playwright + API suites
        working-directory: automation
        run: |
          set -o pipefail
          MARKERS="${{ inputs.markers }}"
          python -m pytest -n 4 --browser ${{ env.BROWSER }} ${MARKERS:+-m "$MARKERS"} 2>&1 | tee reports/pytest-output.txt

      - name: Annotate failures
        if: failure()
        working-directory: automation
        run: |
          grep -E "^(FAILED|ERROR) " reports/pytest-output.txt | head -50 | while read -r line; do
            echo "::error title=pytest::${line}"
          done || true

      - name: Backend logs on failure
        if: failure()
        run: docker compose logs --tail 200 backend simulator

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports-${{ env.BROWSER }}
          path: |
            automation/reports/
            automation/screenshots/
            automation/logs/
          retention-days: 14
